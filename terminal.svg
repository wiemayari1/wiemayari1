<svg width="700" height="360" viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .titlebar { fill: #161b22; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      text { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .user { fill: #8b949e; font-size: 10px; }
      .prompt { fill: #7ee787; font-size: 11px; font-weight: bold; }
      .cmd { fill: #79c0ff; font-size: 11px; }
      .label { fill: #ff7b72; font-size: 11px; }
      .value { fill: #e6edf3; font-size: 11px; }
      .status-on { fill: #7ee787; font-size: 11px; font-weight: bold; }
      .status-dim { fill: #8b949e; font-size: 11px; }
      .quote { fill: #d2a8ff; font-size: 11px; font-style: italic; }
      .header { fill: #58a6ff; font-size: 12px; font-weight: bold; }
      .dots-red { fill: #ff5f56; }
      .dots-yellow { fill: #ffbd2e; }
      .dots-green { fill: #27c93f; }
    </style>
  </defs>

  <!-- Window background -->
  <rect class="bg" x="0" y="0" width="700" height="360" rx="10"/>
  <rect class="border" x="0.5" y="0.5" width="699" height="359" rx="10"/>

  <!-- Title bar -->
  <path class="titlebar" d="M0,10 Q0,0 10,0 H690 Q700,0 700,10 V32 H0 Z"/>
  <line x1="0" y1="32" x2="700" y2="32" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic light dots -->
  <circle class="dots-red" cx="22" cy="16" r="5"/>
  <circle class="dots-yellow" cx="40" cy="16" r="5"/>
  <circle class="dots-green" cx="58" cy="16" r="5"/>

  <!-- Title text -->
  <text x="350" y="20" text-anchor="middle" class="user">wiem@security-terminal</text>

  <!-- Terminal content -->
  <text x="30" y="58" class="header">&gt; System Online.</text>

  <text x="30" y="80" class="prompt">$ <tspan class="cmd">whoami</tspan></text>

  <text x="30" y="102" class="label">Name    <tspan class="status-dim">: </tspan><tspan class="value">Wiem Ayari</tspan></text>
  <text x="30" y="119" class="label">Role    <tspan class="status-dim">: </tspan><tspan class="value">Cybersecurity Engineer in Progress</tspan></text>
  <text x="30" y="136" class="label">Focus   <tspan class="status-dim">: </tspan><tspan class="value">Network Security • Cloud Security</tspan></text>
  <text x="30" y="153" class="label">Mission <tspan class="status-dim">: </tspan><tspan class="value">Learn • Build • Secure</tspan></text>

  <text x="30" y="183" class="prompt">$ <tspan class="cmd">status --check</tspan></text>

  <text x="30" y="205" class="value">Learning Mode<tspan class="status-dim">..........</tspan><tspan class="status-on">ON</tspan></text>
  <text x="30" y="222" class="value">Curiosity<tspan class="status-dim">..............</tspan><tspan class="status-on">UNLIMITED</tspan></text>
  <text x="30" y="239" class="value">Security Mindset<tspan class="status-dim">.......</tspan><tspan class="status-on">ENABLED</tspan></text>
  <text x="30" y="256" class="value">Coffee<tspan class="status-dim">.................</tspan><tspan class="status-on">REQUIRED</tspan> ☕</text>

  <line x1="30" y1="276" x2="670" y2="276" stroke="#30363d" stroke-width="1"/>

  <text x="30" y="302" class="quote">"Learning today. Securing tomorrow."</text>

  <!-- Blinking cursor -->
  <rect x="30" y="311" width="7" height="12" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
