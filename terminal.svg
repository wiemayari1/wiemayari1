<svg width="700" height="440" viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .titlebar { fill: #161b22; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      text { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; }
      .user { fill: #8b949e; font-size: 12px; }
      .prompt { fill: #7ee787; font-size: 13px; font-weight: bold; }
      .cmd { fill: #79c0ff; font-size: 13px; }
      .label { fill: #ff7b72; font-size: 13px; }
      .value { fill: #e6edf3; font-size: 13px; }
      .status-on { fill: #7ee787; font-size: 13px; font-weight: bold; }
      .status-dim { fill: #8b949e; font-size: 13px; }
      .quote { fill: #d2a8ff; font-size: 13px; font-style: italic; }
      .header { fill: #58a6ff; font-size: 15px; font-weight: bold; }
      .dots-red { fill: #ff5f56; }
      .dots-yellow { fill: #ffbd2e; }
      .dots-green { fill: #27c93f; }
    </style>
  </defs>

  <!-- Window background -->
  <rect class="bg" x="0" y="0" width="700" height="440" rx="10"/>
  <rect class="border" x="0.5" y="0.5" width="699" height="439" rx="10"/>

  <!-- Title bar -->
  <path class="titlebar" d="M0,10 Q0,0 10,0 H690 Q700,0 700,10 V38 H0 Z"/>
  <line x1="0" y1="38" x2="700" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic light dots -->
  <circle class="dots-red" cx="24" cy="19" r="6"/>
  <circle class="dots-yellow" cx="45" cy="19" r="6"/>
  <circle class="dots-green" cx="66" cy="19" r="6"/>

  <!-- Title text -->
  <text x="350" y="23" text-anchor="middle" class="user">wiem@security-terminal</text>

  <!-- Terminal content -->
  <text x="30" y="68" class="header">&gt; System Online.</text>

  <text x="30" y="96" class="prompt">$ <tspan class="cmd">whoami</tspan></text>

  <text x="30" y="124" class="label">Name    <tspan class="status-dim">: </tspan><tspan class="value">Wiem Ayari</tspan></text>
  <text x="30" y="145" class="label">Role    <tspan class="status-dim">: </tspan><tspan class="value">Cybersecurity Engineer in Progress</tspan></text>
  <text x="30" y="166" class="label">Focus   <tspan class="status-dim">: </tspan><tspan class="value">Network Security • Cloud Security</tspan></text>
  <text x="30" y="187" class="label">Mission <tspan class="status-dim">: </tspan><tspan class="value">Learn • Build • Secure</tspan></text>

  <text x="30" y="223" class="prompt">$ <tspan class="cmd">status --check</tspan></text>

  <text x="30" y="251" class="value">Learning Mode<tspan class="status-dim">..........</tspan><tspan class="status-on">ON</tspan></text>
  <text x="30" y="272" class="value">Curiosity<tspan class="status-dim">..............</tspan><tspan class="status-on">UNLIMITED</tspan></text>
  <text x="30" y="293" class="value">Security Mindset<tspan class="status-dim">.......</tspan><tspan class="status-on">ENABLED</tspan></text>
  <text x="30" y="314" class="value">Coffee<tspan class="status-dim">...................</tspan><tspan class="status-on">REQUIRED</tspan> ☕</text>

  <line x1="30" y1="340" x2="670" y2="340" stroke="#30363d" stroke-width="1"/>

  <text x="30" y="372" class="quote">"Learning today. Securing tomorrow."</text>

  <!-- Blinking cursor -->
  <rect x="30" y="384" width="8" height="14" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
